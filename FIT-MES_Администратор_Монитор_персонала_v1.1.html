ttom:1px solid #e8edf2;color:#374153}.data tbody tr:nth-child(even){background:#fafbfd}.data tbody tr:hover{background:#edf7ff}.data .right{text-align:right}.tag{display:inline-block;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}.tag.on{background:#dff7e9;color:#15935b;border:1px solid #bbebd0}.tag.off{background:#f0f2f4;color:#77828f;border:1px solid #d9e1e8}.avatar{display:inline-flex;background:#11ad81;color:white;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:10px;margin-right:8px;vertical-align:middle}.emptytable{color:#8694a2;text-align:center;padding:36px}.note{margin-top:12px;color:#718093;font-size:11px;line-height:1.55}.button{border:0;border-radius:4px;padding:10px 13px;color:white;background:linear-gradient(#128ff3,#066fc8);box-shadow:0 2px 3px #003e6a33;font-weight:600;font-size:12px}.button.gray{background:linear-gradient(#7c8997,#657383)}.button.small{padding:7px 10px;font-size:11px}.button.ghost{background:#f8fafc;color:#486783;border:1px solid #d7e0e9;box-shadow:none}.button.red{background:#fbf0f0;color:#c64a4a;border:1px solid #efcaca;box-shadow:none}.button.green{background:#19a960}.fixedfooter{display:flex;justify-content:space-between;align-items:center;margin-top:9px;color:#8390a3;font-size:11px}

.master-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:14px}.master-heading{font-size:20px;color:#293549;font-weight:700}.master-breadcrumb{color:#788699;font-size:12px;margin-top:3px}.master-stage{display:flex;align-items:center;gap:10px;background:#fff;padding:8px 13px;border:1px solid #dbe2ea;border-radius:5px}.master-stage select{border:none;color:#285275;font-weight:600;min-width:190px;outline:0}.stage-summary{display:flex;gap:10px;margin:0 0 14px}.mini-stat{background:#fff;border:1px solid #dbe3eb;border-radius:5px;padding:12px 16px;flex:1;color:#6a788b;font-size:12px}.mini-stat b{color:#283e57;font-size:23px;margin-right:9px}.stations{display:grid;grid-template-columns:repeat(2,minmax(290px,1fr));gap:14px;align-items:start}.station{border:1px solid #d8dfe8;background:#fff;box-shadow:0 2px 5px #1f38520f;border-radius:6px;overflow:hidden}.station-top{border-left:5px solid #19ad65;background:#f1f4f8;border-bottom:1px solid #dfe5ed;padding:11px 13px;display:flex;align-items:center;justify-content:space-between}.station-top.inactive{border-left-color:#808991}.stationname{font-size:14px;font-weight:700;color:#39495b}.station-top small{color:#8795a7;font-size:11px;display:block;margin-top:2px}.station-body{padding:11px 13px}.opline{display:flex;align-items:center;gap:9px;padding:8px 6px;border-bottom:1px solid #edf0f4;min-height:43px}.opline:last-of-type{border-bottom:0}.num-pill{background:#e3effa;border:1px solid #bcd9f1;color:#236693;border-radius:4px;min-width:38px;padding:4px 5px;text-align:center;font-weight:700;font-size:11px}.opname{font-weight:600;color:#344155;flex:1}.time{color:#8a98a9;font-size:11px}.iconbtn{border:1px solid #d4dfe8;background:#fafcff;color:#66758b;border-radius:4px;padding:4px 7px;font-size:12px}.iconbtn:hover{background:#e6f0fa}.iconbtn.del{color:#dc6464;background:#fffafa;border-color:#f1dddd}.expand{border:0;background:none;color:#137ebf;padding:9px 3px;font-size:11px;font-weight:600}.addrow{display:flex;justify-content:space-between;align-items:center;padding-top:10px;gap:10px}.count{font-size:11px;color:#7c8b9c}.subtleempty{color:#909ead;padding:17px 5px;font-size:12px}.overline{font-size:12px;color:#76859a;margin-bottom:9px}.modalback{position:fixed;inset:0;background:#0e1723a9;display:none;justify-content:center;align-items:center;z-index:30;padding:24px}.modalback.show{display:flex}.modal{width:480px;max-width:100%;max-height:85vh;overflow:auto;background:white;border-radius:7px;border:1px solid #dce4ed;box-shadow:0 16px 45px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:17px 22px;background:#f6f8fa;border-bottom:1px solid #dfe6ec;font-size:16px;font-weight:700}.modalbody{padding:18px 22px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 22px;border-top:1px solid #e4eaf0;background:#f8fafc}.resultlist{max-height:260px;overflow:auto;margin-top:12px;border:1px solid #dce4ec;border-radius:5px}.person{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ebf0f4;cursor:pointer}.person:last-child{border-bottom:0}.person.active{background:#e9f4fe}.person small{color:#8191a1;display:block;margin-top:3px}.warning{border:1px solid #f5d99b;border-radius:5px;background:#fff8e9;padding:12px;color:#886827;line-height:1.55;font-size:12px;margin-top:13px}.successnote{padding:10px;background:#e9fbf2;color:#168757;border-radius:4px;font-size:12px;margin-top:8px}.foothelp{font-size:11px;color:#8896a9;padding-top:12px}

</style></head><body>
<div class="app"><aside class="rail"><button class="railbtn" title="Главная">⌂</button><div class="grow"></div><button class="railbtn" title="Статистика">▥</button><button class="railbtn" title="Заказы">▤</button><button id="railAdmin" class="railbtn active" title="Монитор персонала">♙</button><button class="railbtn" title="Настройки">⚙</button></aside><main class="shell"><header class="header"><div class="left"><span class="drop">Управление заказами ▾</span><span class="drop solid">Администратор системы</span></div><div class="logo"><span class="logomark">✺</span> FIT-MES</div></header><section class="screen" id="screen"></section></main></div>
<div id="modalBackground" class="modalback" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>
<script>
const nowMinutes=14*60+40;const today='25.11.2026';
const stages=[{id:'edge',name:'Кромкооблицовка'},{id:'drill',name:'Присадка'},{id:'packing',name:'Упаковка'}];
const machines=[{id:'m1',name:'Кромка №1',code:'P311',stage:'edge',active:true},{id:'m2',name:'Кромка №2',code:'P312',stage:'edge',active:true},{id:'m3',name:'Piramida',code:'P313',stage:'edge',active:false},{id:'m4',name:'Двухсторонний IMAI ALCP0530',code:'P314',stage:'edge',active:false},{id:'m5',name:'SKIPPER №2',code:'P411',stage:'drill',active:true},{id:'m6',name:'Валерий 3000',code:'P412',stage:'drill',active:false},{id:'m7',name:'Упаковка готовой продукции',code:'P511',stage:'packing',active:true}];
const employees=[
{id:1,name:'Иванов Иван',machine:'m1',position:1,start:'08:10',prior:0},
{id:2,name:'Петров Сергей',machine:'m1',position:2,start:'08:15',prior:0},
{id:3,name:'Сидоров Алексей',machine:'m2',position:1,start:'08:05',prior:0},
{id:4,name:'Кузнецов Дмитрий',machine:'m2',position:2,start:'09:00',prior:35},
{id:5,name:'Смирнов Андрей',machine:'m5',position:1,start:'07:55',prior:0},
{id:6,name:'Орлов Максим',machine:'m7',position:1,start:'08:20',prior:0},
{id:7,name:'Фёдоров Николай',machine:'m7',position:2,start:'08:35',prior:0},
{id:8,name:'Зайцев Павел',machine:'m7',position:3,start:'09:10',prior:0},
{id:9,name:'Белов Виктор',machine:'m7',position:4,start:'09:15',prior:0},
{id:10,name:'Морозов Игорь',machine:'m7',position:5,start:'09:15',prior:0},
{id:11,name:'Васильев Роман',machine:null,position:null,start:null,prior:170},
{id:12,name:'Соколов Артём',machine:null,position:null,start:null,prior:0},
{id:13,name:'Волков Денис',machine:null,position:null,start:null,prior:215},
{id:14,name:'Новиков Егор',machine:null,position:null,start:null,prior:0},
{id:15,name:'Попов Михаил',machine:null,position:null,start:null,prior:80},
{id:16,name:'Лебедев Олег',machine:null,position:null,start:null,prior:0},
{id:17,name:'Ковалёв Антон',machine:null,position:null,start:null,prior:0},
{id:18,name:'Богданов Кирилл',machine:null,position:null,start:null,prior:0}
];
let view='admin',statusFilter='all',adminSearch='',masterStage='edge',expanded={},modalMode=null,modalMachine=null,modalEmployee=null,modalSearch='',actionMessage='',showDemoToast=false;
const machineById=id=>machines.find(m=>m.id===id), employeeById=id=>employees.find(e=>e.id===id);
const mins=t=>{if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m};
const formatMins=m=>`${Math.floor(m/60)} ч ${String(m%60).padStart(2,'0')} мин`;
const currentDuration=e=>e.machine ? Math.max(0,nowMinutes-mins(e.start)):0;
const dayDuration=e=>e.prior+currentDuration(e);
const initial=e=>e.name.split(' ').map(x=>x[0]).join('');
const formatTime=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function render(){document.getElementById('screen').innerHTML=view==='admin'?renderAdmin():renderMaster()}
function renderAdmin(){let linked=employees.filter(e=>e.machine).length;let rows=employees.filter(e=>(statusFilter==='all'||(statusFilter==='linked'&&e.machine)||(statusFilter==='unlinked'&&!e.machine))&&e.name.toLowerCase().includes(adminSearch.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
return `<div class="tabbar"><button onclick="noop()">Монитор заказов</button><button onclick="noop()">Монитор загрузки</button><button class="active">Монитор персонала</button></div><div class="inner"><div class="sectionhead"><span>МОНИТОР ПЕРСОНАЛА · ТЕКУЩИЕ ПРИВЯЗКИ</span><span class="meta">Демонстрационные данные · ${today} · 14:40</span></div><div class="summary"><div class="stat"><div><div class="name">Всего операторов</div><div class="num">${employees.length}</div></div><span class="ic">♟</span></div><div class="stat"><div><div class="name">Привязаны к рабочим местам</div><div class="num good">${linked}</div></div><span class="ic">✓</span></div><div class="stat"><div><div class="name">Не привязаны</div><div class="num red">${employees.length-linked}</div></div><span class="ic">⊘</span></div></div><div class="tools"><div class="searchbox"><span>⌕</span><input value="${escapeHtml(adminSearch)}" oninput="adminSearch=this.value;drawAdminTable()" placeholder="Поиск оператора по ФИО..."></div><div class="segmented"><button class="${statusFilter==='all'?'selected':''}" onclick="statusFilter='all';render()">Все</button><button class="${statusFilter==='linked'?'selected':''}" onclick="statusFilter='linked';render()">Привязаны</button><button class="${statusFilter==='unlinked'?'selected':''}" onclick="statusFilter='unlinked';render()">Не привязаны</button></div><span id="shownCount" class="muted">Найдено: ${rows.length}</span></div><div id="adminTable" class="data">${adminTableHtml(rows)}</div><div class="fixedfooter"><span>Только просмотр · пользователи с глобальной ролью «Оператор»</span><span>Привязка не зависит от статуса активности станка</span></div><div class="note">Время «Сегодня» включает все завершённые привязки за дату и время текущей активной авторизации. Отсутствие привязки не означает отсутствие сотрудника на предприятии.</div></div>`}
function adminTableHtml(rows){if(!rows.length)return '<div class="emptytable">Нет операторов, соответствующих фильтрам</div>';return `<table><thead><tr><th>Оператор</th><th>Статус</th><th>Производственный этап</th><th>Рабочее место</th><th>№</th><th>Начало текущей</th><th class="right">Время за сегодня</th></tr></thead><tbody>${rows.map(e=>{const m=machineById(e.machine);const st=m?stages.find(s=>s.id===m.stage).name:'—';return `<tr><td><span class="avatar">${initial(e)}</span><b>${e.name}</b></td><td><span class="tag ${m?'on':'off'}">${m?'● Привязан':'○ Не привязан'}</span></td><td>${st}</td><td>${m?m.name:'—'}</td><td>${m?'№ '+e.position:'—'}</td><td>${e.start||'—'}</td><td class="right"><b>${formatMins(dayDuration(e))}</b></td></tr>`}).join('')}</tbody></table>`}
function drawAdminTable(){const rows=employees.filter(e=>(statusFilter==='all'||(statusFilter==='linked'&&e.machine)||(statusFilter==='unlinked'&&!e.machine))&&e.name.toLowerCase().includes(adminSearch.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'ru'));document.getElementById('adminTable').innerHTML=adminTableHtml(rows);document.getElementById('shownCount').textContent=`Найдено: ${rows.length}`}
function noop(){showToast('В прототипе доступен только новый монитор персонала и раздел распределения операторов.')}
function renderMaster(){let stage=stages.find(s=>s.id===masterStage);let current=machines.filter(m=>m.stage===masterStage);let count=employees.filter(e=>e.machine && current.some(m=>m.id===e.machine)).length;return `<div class="sectionhead"><span>СТРАНИЦА МАСТЕРА</span><span class="meta">Распределение операторов · права согласно привязкам к этапам</span></div><div class="inner"><div class="master-head"><div><div class="master-heading">Распределение операторов</div><div class="master-breadcrumb">Назначение, перевод и открепление сотрудников от рабочих мест</div></div><label class="master-stage"><span class="muted">Этап:</span><select onchange="masterStage=this.value;render()">${stages.map(s=>`<option value="${s.id}" ${s.id===masterStage?'selected':''}>${s.name}</option>`).join('')}</select></label></div><div class="stage-summary"><div class="mini-stat"><b>${current.length}</b> рабочих мест этапа</div><div class="mini-stat"><b>${count}</b> назначенных сотрудников</div></div><div class="overline">РАБОЧИЕ МЕСТА ЭТАПА «${stage.name.toUpperCase()}»</div><div class="stations">${current.map(m=>stationCard(m)).join('')}</div><div class="foothelp">Назначение выполняется по одному сотруднику и начинает отсчёт времени авторизации сразу. Данные автоматически синхронизируются с личным кабинетом оператора и монитором персонала. <strong>Коды станков в макете демонстрационные</strong>; в реальной системе отображается код рабочего места из его настроек, используемый для привязки в личном кабинете.</div></div>`}
function stationCard(m){let ops=employees.filter(e=>e.machine===m.id).sort((a,b)=>a.position-b.position);let maxShown=expanded[m.id]?ops.length:Math.min(3,ops.length);let shown=ops.slice(0,maxShown);return `<div class="station"><div class="station-top ${m.active?'':'inactive'}"><div><div class="stationname">${m.name}</div><div class="station-subline"><span class="station-code">Код: <strong>${m.code}</strong></span><small>Операторов: ${ops.length}</small></div></div><span class="tag ${m.active?'on':'off'}">${m.active?'Активен':'Неактивен'}</span></div><div class="station-body">${shown.map(e=>`<div class="opline"><button title="Изменить номер" class="num-pill" onclick="openChangeNum(${e.id})">№ ${e.position} ▾</button><span class="opname">${e.name}</span><span class="time">с ${e.start}</span><button class="iconbtn del" title="Открепить" onclick="openDetach(${e.id})">✕</button></div>`).join('')||'<div class="subtleempty">К станку никто не привязан</div>'}${ops.length>3?`<button class="expand" onclick="expanded['${m.id}']=!expanded['${m.id}'];render()">${expanded[m.id]?'Свернуть':`Показать ещё ${ops.length-3} операторов`} ▾</button>`:''}<div class="addrow"><span class="count">Номера назначаются по свободным позициям</span><button class="button small" onclick="openAssign('${m.id}')">＋ Назначить оператора</button></div></div></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closeModal(){document.getElementById('modalBackground').classList.remove('show');modalMode=null;modalEmployee=null;modalMachine=null;modalSearch='';actionMessage=''}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackground').classList.add('show')}
function openAssign(machineId){modalMode='assign';modalMachine=machineId;modalEmployee=null;modalSearch='';actionMessage='';renderModal()}
function renderModal(){if(modalMode==='assign'){let m=machineById(modalMachine);let filtered=employees.filter(e=>e.name.toLowerCase().includes(modalSearch.toLowerCase()) && e.machine!==modalMachine).sort((a,b)=>Number(Boolean(a.machine))-Number(Boolean(b.machine))||a.name.localeCompare(b.name,'ru'));
let current=employeeById(modalEmployee);let prev=current&&machineById(current.machine);showModal(`<div class="modalhead"><span>Назначить оператора · ${m.name} <small class="modal-code">Код: ${m.code}</small></span><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modalbody"><div class="muted">Все учётные записи с глобальной ролью «Оператор»</div><div class="searchbox" style="margin-top:12px"><span>⌕</span><input value="${escapeHtml(modalSearch)}" placeholder="Поиск по ФИО..." oninput="modalSearch=this.value;updatePeople()"></div><div id="assignList" class="resultlist">${peopleHtml(filtered)}</div><div id="assignWarn">${current&&prev?`<div class="warning"><b>Оператор уже привязан:</b> ${prev.name} (${stages.find(s=>s.id===prev.stage).name}).<br>После подтверждения прежняя привязка завершится, начнётся новая на станке «${m.name}».</div>`:''}</div></div><div class="modalfoot"><button class="button gray" onclick="closeModal()">Отмена</button><button class="button" ${!current?'disabled':''} id="confirmAssign" onclick="assignSelected()">${prev?'Перевести':'Назначить'}</button></div>`)}else if(modalMode==='detach'){let e=employeeById(modalEmployee);let m=machineById(e.machine);showModal(`<div class="modalhead">Открепить оператора <button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modalbody"><b>${e.name}</b><p>Рабочее место: ${m.name}</p><p class="muted">Текущая авторизация будет завершена. Остальные операторы сохранят свои номера.</p></div><div class="modalfoot"><button class="button gray" onclick="closeModal()">Отмена</button><button class="button red" onclick="confirmDetach()">Открепить</button></div>`)}else if(modalMode==='num'){let e=employeeById(modalEmployee);let ops=employees.filter(x=>x.machine===e.machine&&x.id!==e.id);let max=Math.max(e.position,...ops.map(o=>o.position))+1;showModal(`<div class="modalhead">Изменить номер оператора <button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modalbody"><p><b>${e.name}</b> · ${machineById(e.machine).name}</p><label>Номер оператора: <select id="newPosition" style="padding:8px;border-radius:4px;border:1px solid #d2dfe9;margin-left:7px">${Array.from({length:max},(_,i)=>`<option value="${i+1}" ${e.position===i+1?'selected':''}>Оператор ${i+1}</option>`).join('')}</select></label><p class="muted">Если номер занят, система поменяет номера двух операторов местами.</p></div><div class="modalfoot"><button class="button gray" onclick="closeModal()">Отмена</button><button class="button" onclick="confirmNumber()">Сохранить</button></div>`)}}
function peopleHtml(arr){return arr.map(e=>{let m=machineById(e.machine);return `<div class="person ${modalEmployee===e.id?'active':''}" onclick="chooseEmployee(${e.id})"><div><b>${e.name}</b><small>${m?'Привязан: '+m.name:'Не привязан'}</small></div><span class="tag ${m?'off':'on'}">${m?'Перевод':'Свободен'}</span></div>`}).join('')||'<div class="emptytable">Совпадений не найдено</div>'}
function updatePeople(){let filtered=employees.filter(e=>e.name.toLowerCase().includes(modalSearch.toLowerCase())&&e.machine!==modalMachine).sort((a,b)=>Number(Boolean(a.machine))-Number(Boolean(b.machine))||a.name.localeCompare(b.name,'ru'));document.getElementById('assignList').innerHTML=peopleHtml(filtered)}
function chooseEmployee(id){modalEmployee=id;renderModal();let inpt=document.querySelector('#modal .searchbox input');if(inpt){inpt.focus();inpt.setSelectionRange(inpt.value.length,inpt.value.length)}}
function firstFree(machineId){let used=new Set(employees.filter(e=>e.machine===machineId).map(e=>e.position));let n=1;while(used.has(n))n++;return n}
function assignSelected(){let e=employeeById(modalEmployee);if(!e)return;let old=e.machine;let newNumber=firstFree(modalMachine);if(old){e.prior+=currentDuration(e)}e.machine=modalMachine;e.position=newNumber;e.start=formatTime(nowMinutes);closeModal();render();showToast(old?'Оператор переведён на новое рабочее место':'Оператор назначен на рабочее место')}
function openDetach(id){modalMode='detach';modalEmployee=id;renderModal()}
function confirmDetach(){let e=employeeById(modalEmployee);e.prior+=currentDuration(e);e.machine=null;e.position=null;e.start=null;closeModal();render();showToast('Привязка завершена')}
function openChangeNum(id){modalMode='num';modalEmployee=id;renderModal()}
function confirmNumber(){let e=employeeById(modalEmployee);let old=e.position;let next=Number(document.getElementById('newPosition').value);let occupant=employees.find(x=>x.machine===e.machine&&x.position===next&&x.id!==e.id);if(occupant)occupant.position=old;e.position=next;closeModal();render();showToast('Номер оператора изменён')}
function showToast(msg){let toast=document.createElement('div');toast.textContent=msg;Object.assign(toast.style,{position:'fixed',right:'22px',bottom:'22px',background:'#29465b',color:'white',padding:'13px 18px',borderRadius:'6px',boxShadow:'0 5px 20px #0004',zIndex:'50',fontSize:'13px'});document.body.appendChild(toast);setTimeout(()=>toast.remove(),2700)}
render();
</script></body></html>
